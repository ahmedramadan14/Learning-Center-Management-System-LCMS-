<div class="login-page"><div class="login-container"><section class="login-welcome-panel"><div class="brand-section"><img src="assets/logo2.png" alt="LCMS Logo" class="brand-logo-img"></div><div class="hero-text"><h1>Everything your learning center needs, in one connected system.</h1></div><div class="quick-icons"><span class="icon-box"><i class="bi bi-people"></i> Students</span><span class="icon-box"><i class="bi bi-person-heart"></i> Parents</span><span class="icon-box"><i class="bi bi-calendar2-check"></i> Attendance</span><span class="icon-box"><i class="bi bi-bar-chart"></i> Grades</span><span class="icon-box"><i class="bi bi-credit-card"></i> Payments</span></div><div class="illustration-wrap"><img src="assets/Books.png" alt="Learning center illustration"></div></section><section class="login-form-panel"><div class="form-wrapper"><div class="welcome-heading"><h2>Welcome to EduCenter</h2><p>Sign in to your account</p></div><form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm"><div class="form-group"><label for="phone">Phone number</label><div class="input-with-icon"><i class="bi bi-telephone"></i><input type="tel" id="phone" name="phone" ngModel required placeholder="01xxxxxxxxx" autocomplete="tel"></div></div><div class="form-group"><div class="label-row"><label for="password">Password</label></div><div class="input-with-icon"><i class="bi bi-lock"></i><input [type]="showPassword ? 'text' : 'password'" id="password" name="password" ngModel required placeholder="Enter your password" autocomplete="current-password"><button type="button" class="toggle-password" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"><i class="bi" [ngClass]="showPassword ? 'bi-eye' : 'bi-eye-slash'"></i></button></div></div><p *ngIf="errorMessage" class="form-error">{{ errorMessage }}</p><button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid || submitting">{{ submitting ? 'Signing in...' : 'Sign in' }}</button><div class="signup-link">New to EduCenter? <a routerLink="/register">Create an account</a></div></form></div></section></div></div>
