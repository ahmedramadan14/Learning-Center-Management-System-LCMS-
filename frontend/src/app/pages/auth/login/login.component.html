<div class="login-page">
    <div class="login-container">

        <div class="login-welcome-panel">
            <div class="brand-section">
                <img src="../../../../assets/lcms-logo.jpg" alt="LCMS Logo" class="brand-logo-img">
            </div>

            <div class="hero-text">
                <h1>Everything your learning center needs, in one connected system.</h1>
            </div>

            <div class="quick-icons">
                <div class="icon-box">
                    <span class="icon-circle"><i class="fa-regular fa-user"></i></span>Students
                </div>
                <div class="icon-box">
                    <span class="icon-circle"><i class="fa-regular fa-credit-card"></i></span>Parents
                </div>
                <div class="icon-box">
                    <span class="icon-circle"><i class="fa-regular fa-file-lines"></i></span>Attendance
                </div>
                <div class="icon-box">
                    <span class="icon-circle"><i class="fa-solid fa-chart-column"></i></span>Grades
                </div>
                <div class="icon-box">
                    <span class="icon-circle"><i class="fa-solid fa-chart-column"></i></span>Payments
                </div>
            </div>

            <div class="illustration-wrap">
                <img src="../../../../assets/Books.png" alt="LCMS dashboard illustration">
            </div>
        </div>

        <div class="login-form-panel">
            <div class="form-wrapper">
                <div class="welcome-heading">
                    <h2>Welcome to LCMS</h2>
                    <p>Sign in to your account</p>
                </div>

                <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="phone" name="phone" [(ngModel)]="credentials.phone" required placeholder="01012345678">
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Password</label>
                            <a href="#" class="forgot-pass">Forgot password?</a>
                        </div>
                        <div class="input-with-icon">
                            <i class="fa-regular fa-lock"></i>

                            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="credentials.password"
                                required placeholder="Enter your password">

                            <i class="fa-regular toggle-password" [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"
                                (click)="showPassword = !showPassword" tabindex="0"
                                (keydown.enter)="showPassword = !showPassword"></i>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" name="rememberMe" ngModel>
                            Remember me
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid || loading">
                        {{ loading ? 'Signing in...' : 'Sign in' }}
                    </button>

                    <p class="form-error" *ngIf="error">{{ error }}</p>

                    <div class="signup-link">
                        New to LCMS? <a href="/register">Create an account</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
