<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-brand">
    <div class="brand-logo">
      LC
    </div>

    <div class="brand-text">
      <span class="brand-name">LCMS</span>
      <span class="brand-subtitle">Learning Center</span>
    </div>
  </div>

  <!-- Main Navigation -->
  <nav class="sidebar-nav">

    <div class="nav-section">
      <span class="section-title">MANAGEMENT</span>

      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="nav-item"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>

    <!-- Administration -->
    <div class="nav-section">
      <span class="section-title">ADMINISTRATION</span>

      <a
        *ngFor="let item of administrationItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>

    <!-- System -->
    <div class="nav-section">
      <span class="section-title">SYSTEM</span>

      <a
        *ngFor="let item of systemItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>

  </nav>

  <!-- User Permissions -->
  <div class="permissions-card">

    <div class="permissions-header">
      <span class="permission-icon">✓</span>
      <span>Your Permissions</span>
    </div>

    <div class="permission-item">
      <span>✓</span>
      manage_students
    </div>

    <div class="permission-item">
      <span>✓</span>
      manage_payments
    </div>

    <div class="permission-item">
      <span>✓</span>
      manage_attendance
    </div>

    <div class="permission-item">
      <span>✓</span>
      view_reports
    </div>

    <button class="view-permissions">
      View all
    </button>

  </div>

</aside>
