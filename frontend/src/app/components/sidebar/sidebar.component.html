<aside class="sidebar">

  <div class="sidebar-brand">
    <div class="brand-logo">LC</div>

    <div class="brand-text">
      <span class="brand-name">LCMS</span>
      <span class="brand-subtitle">Learning Center</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-section" *ngIf="visibleMenuItems.length">
      <span class="section-title">MANAGEMENT</span>

      <a
        *ngFor="let item of visibleMenuItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        class="nav-item"
      >
        <i class="nav-icon bi" [ngClass]="item.icon" aria-hidden="true"></i>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>

    <div class="nav-section" *ngIf="visibleAdministrationItems.length">
      <span class="section-title">ADMINISTRATION</span>

      <a
        *ngFor="let item of visibleAdministrationItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
      >
        <i class="nav-icon bi" [ngClass]="item.icon" aria-hidden="true"></i>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>

    <div class="nav-section" *ngIf="visibleSystemItems.length">
      <span class="section-title">SYSTEM</span>

      <a
        *ngFor="let item of visibleSystemItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-item"
      >
        <i class="nav-icon bi" [ngClass]="item.icon" aria-hidden="true"></i>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>
  </nav>

  <div class="permissions-card" *ngIf="permissionItems.length">
    <div class="permissions-header">
      <i class="permission-icon bi bi-shield-check" aria-hidden="true"></i>
      <span>{{ roleLabel }} permissions</span>
    </div>

    <div class="permission-item" *ngFor="let permission of permissionItems | slice:0:4">
      <i class="bi bi-check2" aria-hidden="true"></i>
      {{ permission }}
    </div>

    <span class="view-permissions" *ngIf="permissionItems.length > 4">+{{ permissionItems.length - 4 }} more</span>
  </div>

  <div class="sidebar-footer">
    <a class="sidebar-profile-link" routerLink="/dashboard/profile" routerLinkActive="active">
      <i class="bi bi-person-circle" aria-hidden="true"></i>
      <span>My profile</span>
    </a>
    <button class="logout-button" type="button" (click)="logout()" [disabled]="loggingOut">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span>{{ loggingOut ? 'Signing out...' : 'Logout' }}</span>
    </button>
  </div>

</aside>
